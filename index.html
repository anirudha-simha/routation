<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Baseline Content Security Policy for static GitHub Pages deployment:
      - script-src 'self': blocks injected inline scripts
      - worker-src 'self' blob:: MapLibre GL JS spawns WebGL tile-parsing Web Workers
      - connect-src: whitelists only active keyless geo providers (Photon, Nominatim, Wikipedia, FOSSGIS OSRM, OpenFreeMap)
      - form-action 'none': blocks unauthorized form submissions (does not inherit from default-src)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://*.wikimedia.org; font-src 'self' data: https://tiles.openfreemap.org; worker-src 'self' blob:; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https://photon.komoot.io https://nominatim.openstreetmap.org https://en.wikipedia.org https://routing.openstreetmap.de https://tiles.openfreemap.org; form-action 'none'; object-src 'none'; base-uri 'self';"
    />
    <title>Routation — Multi-Stop Route Optimizer</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
